name: Publish Docker images

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git tag, branch or commit to build
        required: true
        default: v0.1.0-beta.1
        type: string
      image_tag:
        description: Docker image tag
        required: true
        default: 0.1.0-beta.1
        type: string
      api_base_url:
        description: Public backend URL embedded into Next.js
        required: true
        default: http://31.129.106.155:8080
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/farianskiy/electroniccrm-api
  WEB_IMAGE: ghcr.io/farianskiy/electroniccrm-web

jobs:
  publish-api:
    name: Publish API image
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ inputs.image_tag }}
            ${{ env.API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.image_tag }}

  publish-web:
    name: Publish web image
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/electronic-service-web
          file: ./frontend/electronic-service-web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.api_base_url }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ inputs.image_tag }}
            ${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
